<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>TYPO CAM</title>
    <meta name="description" content="空間に言葉を置いて、思い出を残すARタイポカメラ">

    <!-- Versions pinned exactly (not "@1") so jsdelivr never needs to re-resolve against the
         npm registry at runtime -- it can serve these cached files even if the package is ever
         unpublished or the @8thwall npm account disappears. -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1.0.0/dist/landing-page.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="src/index.css">
  </head>
  <body>
    <!-- The main canvas used for drawing by the app; also the source frame for photos and video. -->
    <canvas id="camerafeed"></canvas>

    <!-- Everything below is DOM on top of the canvas, so it never ends up in photos or videos. -->
    <div id="ui">
      <p id="guide">空間に文字を置く</p>

      <button id="recipe-open" class="glass-button" type="button" aria-label="レシピを共有">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        <span>レシピ</span>
      </button>

      <div id="selection-bar" hidden>
        <span id="selection-hint">ドラッグで移動・ピンチで拡大縮小・ひねって回転</span>
        <div id="selection-actions">
          <button id="selection-delete" class="glass-button" type="button" aria-label="この文字を削除">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
          <button id="selection-done" class="glass-button glass-pill" type="button">完了</button>
        </div>
      </div>

      <nav id="toolbar" aria-label="ツール">
        <button class="tool" type="button" data-tool="text" aria-label="文字入力">
          <span class="tool-icon tool-icon-text">Aa</span><span class="tool-label">文字</span>
        </button>
        <button class="tool" type="button" data-tool="style" aria-label="スタイル">
          <span class="tool-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
          </span><span class="tool-label">スタイル</span>
        </button>
        <button class="tool" type="button" data-tool="font" aria-label="フォント">
          <span class="tool-icon tool-icon-font" id="tool-font-preview">あ</span><span class="tool-label">フォント</span>
        </button>
        <button class="tool" type="button" data-tool="color" aria-label="カラー">
          <span class="tool-icon"><span id="tool-color-dot"></span></span><span class="tool-label">カラー</span>
        </button>
      </nav>

      <!-- Bottom sheets, one per tool; only one is open at a time. -->
      <section class="sheet" data-sheet="style" hidden>
        <div id="style-row" class="sheet-row" role="group" aria-label="スタイルを選択"></div>
      </section>
      <section class="sheet" data-sheet="font" hidden>
        <div id="font-row" class="sheet-row" role="group" aria-label="フォントを選択"></div>
      </section>
      <section class="sheet" data-sheet="color" hidden>
        <div id="color-row" class="sheet-row sheet-row-colors" role="group" aria-label="カラーを選択"></div>
      </section>

      <div id="capture-bar">
        <span id="record-timer" hidden>0:00</span>
        <button id="shutter" type="button" aria-label="写真を撮る"><span></span></button>
        <div id="mode-switch" role="radiogroup" aria-label="撮影モード">
          <button type="button" role="radio" data-mode="photo" aria-checked="true">写真</button>
          <button type="button" role="radio" data-mode="video" aria-checked="false">動画</button>
        </div>
      </div>
    </div>

    <!-- Full-screen text entry, Instagram-style: the typed text previews in the current font/color. -->
    <form id="text-editor" hidden>
      <div id="text-editor-top">
        <button id="text-editor-cancel" type="button" class="link-button">キャンセル</button>
        <button id="text-editor-done" type="submit" class="link-button link-button-strong">完了</button>
      </div>
      <input id="text-input" type="text" maxlength="20" placeholder="言葉を入力" autocomplete="off" enterkeyhint="done" aria-label="配置する文字">
      <p id="text-editor-note">入力後、空間をタップすると文字を置けます</p>
    </form>

    <!-- Result of a capture: the photo or video, with save / retake. -->
    <div id="result" hidden>
      <div id="result-media"></div>
      <div id="result-actions">
        <button id="result-close" type="button" class="glass-button glass-pill">撮り直す</button>
        <button id="result-save" type="button" class="solid-pill">保存</button>
      </div>
      <a id="result-download" hidden></a>
    </div>

    <!-- Recipe share sheet. -->
    <div id="recipe" hidden>
      <div id="recipe-card">
        <p class="recipe-title">このレシピを共有</p>
        <p id="recipe-preview"></p>
        <p id="recipe-meta"></p>
        <p class="recipe-note">リンクを開いた人は、同じ文字設定で自分の場所に置いて撮影できます</p>
        <div id="recipe-actions">
          <button id="recipe-close" type="button" class="glass-button glass-pill">閉じる</button>
          <button id="recipe-share" type="button" class="solid-pill">リンクを共有</button>
        </div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="flash"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
